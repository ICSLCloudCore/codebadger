services:
  # All-in-one CodeBadger service (Joern + MCP server)
  codebadger:
    build:
      context: .
      dockerfile: Dockerfile
    image: codebadger:latest
    container_name: codebadger
    ports:
      # MCP server port
      - "4242:4242"
      # Joern server port range
      - "13371-13399:13371-13399"
    volumes:
      # Mount playground for CPG/code persistent storage
      - ./playground:/playground
      # Optional: Mount custom config file (uncomment to use)
      - ./config.yaml:/app/config.yaml
      # 挂载需要分析的代码目录，可根据实际需求修改
      - /data/code/:/data/code
    environment:
      # Optional: Override default config via environment variables
      - MCP_PORT=4242
      - MCP_LOG_LEVEL=INFO
      - JOERN_MEMORY_LIMIT=8g
      - OTEL_ENABLED=false
      - CPG_GENERATION_TIMEOUT=1200
    restart: unless-stopped
    ulimits:
      # Increase open file limit for Joern
      nofile:
        soft: 65536
        hard: 65536